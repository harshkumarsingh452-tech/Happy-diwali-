<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Bestie ✨</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #080710;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .banner {
            background: rgba(25, 20, 40, 0.85);
            border: 2px solid #ffb703;
            padding: 12px 28px;
            border-radius: 30px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(255, 183, 3, 0.4);
            text-align: center;
            pointer-events: auto;
            backdrop-filter: blur(6px);
            animation: glow 2s infinite alternate;
        }
        @keyframes glow {
            from { box-shadow: 0 0 10px rgba(255, 183, 3, 0.4); }
            to { box-shadow: 0 0 25px rgba(255, 183, 3, 0.8); }
        }
        .controls {
            pointer-events: auto;
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }
        button {
            background: linear-gradient(135deg, #ff7b00, #ffb703);
            border: none;
            padding: 12px 22px;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <div class="banner">✨ Bestie &bull; Forever Partner in Crime ✨</div>
        <div class="controls">
            <button onclick="triggerFireworks()">🎆 Phuljhadi / Sparkles</button>
            <button onclick="toggleMusic()">🎵 Play Music</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer, avatars, lanterns = [], fireworks = [];
        let isMusicPlaying = false, audioCtx;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x080710);
            scene.fog = new THREE.FogExp2(0x080710, 0.02);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4.5, 11);
            camera.lookAt(0, 2, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Lights
            const ambient = new THREE.AmbientLight(0xffeedb, 0.8);
            scene.add(ambient);

            const mainLight = new THREE.DirectionalLight(0xffaa44, 1.2);
            mainLight.position.set(5, 15, 8);
            scene.add(mainLight);

            buildScene();
            buildAvatars();
            buildLanterns();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function buildScene() {
            // Cobblestone ground
            const groundGeo = new THREE.PlaneGeometry(40, 40);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x181528, roughness: 0.7 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // Buildings
            const colors = [0xd97706, 0xbe185d, 0x6d28d9, 0x0284c7, 0x059669];
            for (let i = -16; i <= 16; i += 4) {
                if (Math.abs(i) < 4) continue;
                createHouse(i, -8, colors[Math.floor(Math.random() * colors.length)]);
                createHouse(i, 8, colors[Math.floor(Math.random() * colors.length)]);
            }
        }

        function createHouse(x, z, color) {
            const h = 7 + Math.random() * 5;
            const geo = new THREE.BoxGeometry(3.2, h, 3.2);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.5 });
            const house = new THREE.Mesh(geo, mat);
            house.position.set(x, h / 2, z);
            scene.add(house);

            // Diya Warm Glow
            const light = new THREE.PointLight(0xff9900, 1, 5);
            light.position.set(x, h - 1, z + (z > 0 ? -1.7 : 1.7));
            scene.add(light);
        }
